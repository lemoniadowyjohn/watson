name: Power Platform portfolio validation

on:
  push:
    branches: [main]
    paths:
      - "schema/**"
      - "powerfx/**"
      - "flows/**"
      - "governance/**"
      - "samples/**"
      - "docs/**"
      - "scripts/**"
      - "portfolio/power-platform-quality-app/**"
      - "README.md"
      - ".github/workflows/power-platform-docs-ci.yml"
  pull_request:
    paths:
      - "schema/**"
      - "powerfx/**"
      - "flows/**"
      - "governance/**"
      - "samples/**"
      - "docs/**"
      - "scripts/**"
      - "portfolio/power-platform-quality-app/**"
      - "README.md"
      - ".github/workflows/power-platform-docs-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate root reference implementation
        run: python scripts/validate_docs.py
      - name: Validate recruiter-facing portfolio mirror
        run: python portfolio/power-platform-quality-app/scripts/validate_docs.py
