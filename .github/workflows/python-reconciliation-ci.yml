name: Python reconciliation demo CI

on:
  push:
    branches: [main]
    paths:
      - "portfolio/python-excel-data-reconciliation-demo/**"
      - ".github/workflows/python-reconciliation-ci.yml"
  pull_request:
    paths:
      - "portfolio/python-excel-data-reconciliation-demo/**"
      - ".github/workflows/python-reconciliation-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio/python-excel-data-reconciliation-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m compileall -q src
      - run: python -m reconcile_demo.cli data/synthetic/source_a.csv data/synthetic/source_b.csv --output out/reconciliation.xlsx
